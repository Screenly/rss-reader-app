---
# Creates a feed app (e.g. BBC News) in one environment. Add the app to
# deployed-apps.yml first; this reads its name, description, icon and feed
# from there, then runs the shared edge-apps-actions initialize. Afterwards,
# put the new id in deployed-apps.yml so Update RSS Reader Apps deploys it.
name: Initialize Custom RSS Reader App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to initialize in'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - production

      app_key:
        description: "App key in deployed-apps.yml (e.g. 'bbc-news')"
        required: true
        type: string

permissions:
  contents: read

run-name: Initialize RSS Reader - ${{ inputs.app_key }} in ${{ inputs.environment }}

jobs:
  initialize:
    name: Initialize ${{ inputs.app_key }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: feed-app-${{ inputs.environment }}-${{ inputs.app_key }}
      cancel-in-progress: false

    steps:
      # The app is built from the ref this run starts on, so refuse anything
      # but the default branch rather than creating it from unreleased code
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this from $DEFAULT_BRANCH, not $GITHUB_REF_NAME."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Apply ${{ inputs.app_key }} config
        id: config
        uses: ./.github/actions/apply-feed-app
        with:
          app_key: ${{ inputs.app_key }}
          environment: ${{ inputs.environment }}

      # Refuses to run if deployed-apps.yml already has an id for this
      # environment, or if an app with this name already exists
      - name: Initialize ${{ inputs.app_key }}
        uses: Screenly/edge-apps-actions/initialize@v26.10.2
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: ${{ inputs.environment }}
          edge_app_name: ${{ steps.config.outputs.app_name }}
          edge_app_title: ${{ steps.config.outputs.app_name }}
          edge_app_id: ${{ steps.config.outputs.edge_app_id }}

      # The shared action's summary says to set a repo variable; feed apps
      # keep their ids in deployed-apps.yml instead. Runs even if a later
      # step failed, as long as the app was created.
      - name: Report where the id goes
        if: always()
        env:
          APP_KEY: ${{ inputs.app_key }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ID="$(grep -E '^id:[[:space:]]*' screenly.yml | head -1 | awk '{print $2}' | tr -d "\"'" || true)"
          [ -n "$ID" ] || exit 0
          echo "::notice::Feed app id: set apps.$APP_KEY.ids.$ENVIRONMENT to $ID in deployed-apps.yml (not a repo variable)."
          {
            echo "## Feed app id"
            echo ""
            echo "This is a feed app, so ignore the note above about repository variables. Set this in \`deployed-apps.yml\` and merge it:"
            echo ""
            echo '```yaml'
            echo "apps:"
            echo "  $APP_KEY:"
            echo "    ids:"
            echo "      $ENVIRONMENT: '$ID'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
