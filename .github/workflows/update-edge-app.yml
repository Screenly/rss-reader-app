---
name: Update Edge App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

run-name: Updating RSS Reader in ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'stage' }}

jobs:
  deploy-stage:
    name: Updating RSS Reader in stage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: stage
    steps:
      - uses: actions/checkout@v6
      - uses: Screenly/edge-apps-actions/update@v26.9.0
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: stage
          delete_missing_settings: 'true'
          edge_app_id: ${{ secrets.EDGE_APP_ID || vars.STAGE_EDGE_APP_ID }}

  deploy-production:
    name: Updating RSS Reader in production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: Screenly/edge-apps-actions/update@v26.9.0
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: production
          delete_missing_settings: 'true'
          edge_app_id: ${{ secrets.EDGE_APP_ID || vars.PRODUCTION_EDGE_APP_ID }}
