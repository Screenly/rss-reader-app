---
name: Initialize Edge App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for initialization
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production
      edge_app_name:
        description: Edge App name (used for the CLI --name flag)
        required: true
        type: string
      edge_app_title:
        description: Display title for the Edge App instance
        required: true
        type: string

permissions:
  contents: read

run-name: Initializing ${{ inputs.edge_app_name }} in ${{ inputs.environment }}

jobs:
  # The reusable workflow builds whatever ref this run was started from, so
  # refuse anything but the default branch rather than initializing an app
  # (possibly in production) from unreleased code. This fails loudly instead
  # of skipping, so a run from the wrong branch can't look like a success.
  verify-ref:
    name: Verify default branch
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Initialize Edge App must be run from $DEFAULT_BRANCH, not $GITHUB_REF_NAME."
            exit 1
          fi

  initialize:
    needs: verify-ref
    uses: Screenly/edge-apps-actions/.github/workflows/initialize.yml@v26.10.2
    with:
      environment: ${{ inputs.environment }}
      edge_app_name: ${{ inputs.edge_app_name }}
      edge_app_title: ${{ inputs.edge_app_title }}
    secrets:
      SCREENLY_API_TOKEN: ${{ secrets.SCREENLY_API_TOKEN }}
