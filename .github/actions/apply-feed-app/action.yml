---
name: Apply feed app config
description: >
  Turns screenly.yml into the manifest for one feed app from deployed-apps.yml,
  so the shared edge-apps-actions can deploy it like any other Edge App. The
  code is the same for every feed app; only these manifest fields differ.

inputs:
  app_key:
    description: Key of the app under `apps:` in deployed-apps.yml (e.g. bbc-news)
    required: true
  environment:
    description: stage or production, to look up the app's id for it
    required: true
  override_description:
    description: Use instead of the app's description (optional)
    required: false
    default: ''
  override_icon_url:
    description: Use instead of the app's icon_url (optional)
    required: false
    default: ''
  override_rss_title:
    description: Use instead of the app's rss_title (optional)
    required: false
    default: ''
  override_rss_url:
    description: Use instead of the app's rss_url (optional)
    required: false
    default: ''

outputs:
  app_name:
    description: The app's app_name, used as the Edge App name and instance title
    value: ${{ steps.apply.outputs.app_name }}
  edge_app_id:
    description: The app's id for this environment, or empty if it has none yet
    value: ${{ steps.apply.outputs.edge_app_id }}

runs:
  using: composite
  steps:
    - name: Setup yq
      uses: ./.github/actions/setup-yq

    - name: Apply ${{ inputs.app_key }} to screenly.yml
      id: apply
      shell: bash
      # Inputs arrive as environment variables, never pasted into the script,
      # so quotes or $ in a description can't break the step
      env:
        APP_KEY: ${{ inputs.app_key }}
        ENVIRONMENT: ${{ inputs.environment }}
        OVERRIDE_DESCRIPTION: ${{ inputs.override_description }}
        OVERRIDE_ICON_URL: ${{ inputs.override_icon_url }}
        OVERRIDE_RSS_TITLE: ${{ inputs.override_rss_title }}
        OVERRIDE_RSS_URL: ${{ inputs.override_rss_url }}
      run: |
        set -euo pipefail

        APP_JSON=$(yq -o=json '.apps' deployed-apps.yml | jq -c --arg key "$APP_KEY" '.[$key] // empty')
        if [ -z "$APP_JSON" ]; then
          echo "::error::No app '$APP_KEY' in deployed-apps.yml."
          exit 1
        fi

        field() {
          jq -r --arg f "$1" '.[$f] // "" | tostring' <<<"$APP_JSON"
        }

        APP_NAME=$(field app_name)
        DESCRIPTION="${OVERRIDE_DESCRIPTION:-$(field description)}"
        ICON_URL="${OVERRIDE_ICON_URL:-$(field icon_url)}"
        RSS_TITLE="${OVERRIDE_RSS_TITLE:-$(field rss_title)}"
        RSS_URL="${OVERRIDE_RSS_URL:-$(field rss_url)}"
        EDGE_APP_ID=$(jq -r --arg env "$ENVIRONMENT" '(.ids // {})[$env] // "" | tostring' <<<"$APP_JSON")

        for name in APP_NAME DESCRIPTION ICON_URL RSS_TITLE RSS_URL; do
          if [ -z "${!name}" ]; then
            echo "::error::'$APP_KEY' in deployed-apps.yml is missing $(tr '[:upper:]' '[:lower:]' <<<"$name")."
            exit 1
          fi
        done

        # The shared actions take the id as an input, so the manifest must
        # not carry one
        export DESCRIPTION ICON_URL RSS_TITLE RSS_URL
        yq -i '
          del(.id) |
          .description = strenv(DESCRIPTION) |
          .icon = strenv(ICON_URL) |
          .settings.rss_title.default_value = strenv(RSS_TITLE) |
          .settings.rss_url.default_value = strenv(RSS_URL)
        ' screenly.yml

        {
          echo "app_name=$APP_NAME"
          echo "edge_app_id=$EDGE_APP_ID"
        } >> "$GITHUB_OUTPUT"

    - name: Show manifest for ${{ inputs.app_key }}
      shell: bash
      run: cat screenly.yml
