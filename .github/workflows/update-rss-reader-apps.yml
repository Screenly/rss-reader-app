---
# Deploys every feed app in deployed-apps.yml (BBC News, Fox News, ...). They
# all run this repo's code; each is the shared edge-apps-actions update with
# its own id and a manifest made from its deployed-apps.yml entry. The main
# RSS Reader app deploys separately, through update-edge-app.yml.
name: Update RSS Reader Apps

on:
  push:
    branches:
      - main
    # Numeric CalVer tags only, matching update-edge-app.yml
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      app_key:
        description: "App key (leave empty to update ALL apps, or enter one key like 'bbc-news')"
        required: false
        type: string

      override_description:
        description: 'Override app description (optional, leave empty to use deployed-apps.yml)'
        required: false
        type: string

      override_rss_title:
        description: 'Override RSS title (optional, leave empty to use deployed-apps.yml)'
        required: false
        type: string

      override_icon_url:
        description: 'Override icon URL (optional, leave empty to use deployed-apps.yml)'
        required: false
        type: string

      override_rss_url:
        description: 'Override RSS URL (optional, leave empty to use deployed-apps.yml)'
        required: false
        type: string

permissions:
  contents: read

run-name: Update RSS Reader${{ inputs.app_key && format(' - {0}', inputs.app_key) || 's (ALL)' }} in ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'stage' }}

jobs:
  prepare:
    name: Prepare App Matrix
    runs-on: ubuntu-latest
    # Deleting a tag also sends a push event; never deploy on that.
    if: ${{ !github.event.deleted }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      environment: ${{ steps.set-env.outputs.environment }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only numeric CalVer tags (v26.11.0) are releases, matching the tag
      # filter above and update-edge-app.yml. This is the one place that
      # decides; a manual run on any other ref, including a tag such as vrc1,
      # stays on stage.
      - name: Set environment
        id: set-env
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9] ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=stage" >> "$GITHUB_OUTPUT"
          fi

      # Same rules as the shared update workflow: production only from tags on
      # the default branch, stage only from the default branch itself.
      - name: Verify ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ENVIRONMENT: ${{ steps.set-env.outputs.environment }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH; refusing to deploy to production."
              exit 1
            fi
          elif [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Stage deploys run from $DEFAULT_BRANCH only, not $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Setup yq
        uses: ./.github/actions/setup-yq

      # An app without an id for this environment (e.g. not yet initialized in
      # production) is skipped, not deployed with an empty id
      - name: Generate App Matrix
        id: set-matrix
        env:
          APP_KEY: ${{ inputs.app_key }}
          ENVIRONMENT: ${{ steps.set-env.outputs.environment }}
        run: |
          set -euo pipefail
          APPS=$(yq -o=json '.apps' deployed-apps.yml)

          if [ -n "$APP_KEY" ] && [ "$(jq --arg key "$APP_KEY" 'has($key)' <<<"$APPS")" != true ]; then
            echo "::error::No app '$APP_KEY' in deployed-apps.yml."
            exit 1
          fi

          MATRIX=$(jq -c --arg env "$ENVIRONMENT" --arg key "$APP_KEY" '
            to_entries
            | map(select($key == "" or .key == $key))
            | map({key, id: ((.value.ids // {})[$env] // "" | tostring)})
            | map(select(.id != ""))
          ' <<<"$APPS")

          SKIPPED=$(jq -r --arg env "$ENVIRONMENT" --arg key "$APP_KEY" '
            to_entries
            | map(select(($key == "" or .key == $key) and (((.value.ids // {})[$env] // "") | tostring) == ""))
            | map(.key) | join(", ")
          ' <<<"$APPS")
          if [ -n "$SKIPPED" ]; then
            echo "::notice::No $ENVIRONMENT id in deployed-apps.yml, skipping: $SKIPPED"
          fi

          if [ "$(jq length <<<"$MATRIX")" -eq 0 ]; then
            echo "::error::No apps to deploy: none selected have an id for $ENVIRONMENT."
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploying to $ENVIRONMENT"
            jq -r '.[] | "- \(.key): \(.id)"' <<<"$MATRIX"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Update ${{ matrix.app.key }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    # One deploy at a time per app and environment; a running one is never
    # cancelled, matching the shared workflows
    concurrency:
      group: feed-app-${{ needs.prepare.outputs.environment }}-${{ matrix.app.key }}
      cancel-in-progress: false
    strategy:
      matrix:
        app: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Apply ${{ matrix.app.key }} config
        uses: ./.github/actions/apply-feed-app
        with:
          app_key: ${{ matrix.app.key }}
          environment: ${{ needs.prepare.outputs.environment }}
          override_description: ${{ inputs.override_description }}
          override_icon_url: ${{ inputs.override_icon_url }}
          override_rss_title: ${{ inputs.override_rss_title }}
          override_rss_url: ${{ inputs.override_rss_url }}

      - name: Deploy ${{ matrix.app.key }}
        uses: Screenly/edge-apps-actions/update@v26.10.2
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: ${{ needs.prepare.outputs.environment }}
          edge_app_id: ${{ matrix.app.id }}
          # Settings removed from screenly.yml are removed from the app too
          delete_missing_settings: 'true'
